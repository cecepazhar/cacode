[package]
name = "cacode"
version = "0.2.0"
edition = "2021"
description = "CACode — Full-lifecycle sovereign Rust development CLI & chat-agent"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cecepazhar/cacode"

[[bin]]
name = "cacode"
path = "src/bin/cacode.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
reedline = "0.51"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
walkdir = "2.5"
axum = "0.7"
hyper = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
strip = true
