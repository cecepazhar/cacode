[package]
name = "cacode-core"
version = "1.2.0"
edition = "2021"
description = "CACode core library — commands logic, types, ReAct agent, tools, monitor, report"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cecepazhar/cacode"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
walkdir = "2.5"
axum = "0.7"
hyper = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "time", "io-util", "fs"] }
tokio-util = "0.7"
reedline = "0.51"
toml = "0.8"
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
similar = "2"
ignore = "0.4"
globset = "0.4"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
html2text = "0.17"
url = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c-sharp = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
