[package]
name = "cacode-core"
version = "1.0.2"
edition = "2021"
description = "CACode core library — commands logic, types, ReAct agent, monitor, report"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cecepazhar/cacode"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
walkdir = "2.5"
axum = "0.7"
hyper = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
reedline = "0.51"
toml = "0.8"
