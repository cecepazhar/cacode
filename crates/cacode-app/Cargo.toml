[package]
name = "cacode-app"
version = "1.0.6"
edition = "2021"
description = "CACode CLI binary — entry point, clap, TUI"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cecepazhar/cacode"

[[bin]]
name = "cacode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
cacode-core = { path = "../cacode-core" }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
reedline = "0.51"
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
walkdir = "2"
